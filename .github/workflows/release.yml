# Build the B-SS Rust example and publish a GitHub Release (binaries + metrics.json) when a
# vX.Y.Z tag is pushed. PRs run the same build + smoke test without publishing.
#
# Like the C# sibling, this build has TWO stages: (1) build the native CAS BACnet Stack shared
# library from the stack submodule's C++ source (MSBuild's ReleaseDll|x64 configuration on
# Windows, g++ -shared on Linux - see README.md "Build the native CAS BACnet Stack library"),
# then (2) `cargo build --release` this project and copy that native library next to its output
# so the vendored `libloading` adapter can find it at run time.
#
# THIS IS, AS FAR AS THIS PROJECT IS AWARE, THE FIRST AUTOMATED CI COMPILATION GATE THE STACK'S
# RUST ADAPTER (cas_bacnet_stack_adapters.rs, vendored into src/cas_bacnet_stack/) HAS EVER HAD.
# Its own header comment says it was previously checked exactly once, by hand, against its own
# standalone Cargo.toml (#1483, 2026-09-12) - not a standing gate. See AGENTS.md.
#
# The CAS BACnet Stack is a PRIVATE git submodule: the repository secret CAS_STACK_PAT must
# hold a PAT with read access to chipkin/cas-bacnet-stack.
name: build-and-release

on:
  pull_request:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 pins the VS 2022 (v143) toolset the stack's ReleaseDll config
          # (and the released binaries) are built with.
          - os: windows-2022
            artifact: BACnetProfileExampleBSSRust-windows-x64
            exe: bacnet-profile-example-b-ss-rust.exe
            nativelib: CASBACnetStack_x64_Release.dll
            metrics: metrics-windows.json
          - os: ubuntu-latest
            artifact: BACnetProfileExampleBSSRust-linux-x64
            exe: bacnet-profile-example-b-ss-rust
            nativelib: libCASBACnetStack_x64_Release.so
            metrics: metrics-linux.json
    steps:
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout (with the CAS BACnet Stack submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CAS_STACK_PAT || github.token }}

      - name: Stack commit (recorded in metrics.json)
        id: stack
        shell: bash
        run: echo "sha=$(git -C submodules/cas-bacnet-stack rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the native CAS BACnet Stack library (Windows - MSBuild ReleaseDll|x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild submodules\cas-bacnet-stack\projects\msvs\BuildCASBACnetStack.sln `
            /p:Configuration=ReleaseDll /p:Platform=x64 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }
          Get-ChildItem submodules\cas-bacnet-stack\bin\CASBACnetStack_x64_Release.dll

      - name: Build the native CAS BACnet Stack library (Linux - g++ shared)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p submodules/cas-bacnet-stack/bin
          g++ -shared -fPIC -std=c++17 -O2 \
              -I submodules/cas-bacnet-stack/source \
              submodules/cas-bacnet-stack/source/*.cpp \
              -o submodules/cas-bacnet-stack/bin/libCASBACnetStack_x64_Release.so
          ls -la submodules/cas-bacnet-stack/bin/libCASBACnetStack_x64_Release.so

      - name: cargo build --release
        shell: bash
        run: cargo build --release

      - name: Copy the native library next to the Cargo output
        shell: bash
        run: cp "submodules/cas-bacnet-stack/bin/${{ matrix.nativelib }}" "target/release/${{ matrix.nativelib }}"

      - name: Smoke test + metrics (starts, binds, stays up; measures time to 'ready')
        shell: bash
        run: |
          cd target/release
          start=$(date +%s%3N)
          ./"${{ matrix.exe }}" --port 47822 > smoke.log 2>&1 &
          PID=$!
          ready_ms=""
          for i in $(seq 1 100); do
            if grep -q "ready" smoke.log; then ready_ms=$(( $(date +%s%3N) - start )); break; fi
            sleep 0.1
          done
          sleep 2
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" 2>/dev/null || true; else echo "FAIL: device exited early"; cat smoke.log; exit 1; fi
          [ -n "$ready_ms" ] || { echo "FAIL: no 'ready' line"; cat smoke.log; exit 1; }
          cat smoke.log
          cd - > /dev/null
          bytes=$(stat -c %s "target/release/${{ matrix.exe }}" 2>/dev/null || wc -c < "target/release/${{ matrix.exe }}")
          sha=$(sha256sum "target/release/${{ matrix.exe }}" | cut -c1-16)
          stackver=$(grep -oE 'CAS BACnet Stack v[0-9.]+' "target/release/smoke.log" | head -1 | grep -oE '[0-9.]+' || true)
          appver=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' "target/release/smoke.log" | head -1 || true)
          cat > "${{ matrix.metrics }}" <<EOF
          {
            "example": "BACnetProfileExampleBSSRust",
            "app_version": "$appver",
            "os": "${{ matrix.os }}",
            "link_mode": "libloading-dlopen",
            "stack_commit": "${{ steps.stack.outputs.sha }}",
            "stack_version": "$stackver",
            "binary_bytes": $bytes,
            "binary_sha256_prefix": "$sha",
            "startup_ms_to_ready": $ready_ms,
            "rustc_version": "$(rustc --version)",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_ref": "${{ github.ref_name }}"
          }
          EOF
          cat "${{ matrix.metrics }}"
          { echo '### metrics (${{ matrix.os }})'; echo '```json'; cat "${{ matrix.metrics }}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.exe }}" dist/ 2>/dev/null || true
          cp "target/release"/*.dll dist/ 2>/dev/null || true
          cp "target/release"/*.so dist/ 2>/dev/null || true
          cp "${{ matrix.metrics }}" dist/
          cp README.md TUTORIAL.md LICENSE dist/ 2>/dev/null || true
          cp docs/PICS.md dist/ 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
